<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PLU Search & Inventory</title>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --surface2: #243044;
      --border: #2d3a4f;
      --text: #e7ecf3;
      --text-muted: #8b9bb4;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
      --radius: 10px;
      --shadow: 0 4px 20px rgba(0,0,0,0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header .stats {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .stat-pill {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .stat-pill strong {
      color: var(--text);
      font-weight: 600;
    }

    /* Search bar */
    .search-section {
      margin-bottom: 24px;
    }

    .search-box {
      position: relative;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .search-box input {
      flex: 1;
      min-width: 220px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 18px 14px 48px;
      font-size: 1rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
    }

    .search-box input::placeholder {
      color: var(--text-muted);
    }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
      font-size: 1.1rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 12px 18px;
      border: none;
      border-radius: var(--radius);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-secondary {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: var(--border);
    }

    .btn-success {
      background: var(--success);
      color: #052e16;
    }

    .btn-success:hover {
      background: #16a34a;
    }

    .btn-danger {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
      padding: 6px 12px;
      font-size: 0.8rem;
    }

    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.15);
    }

    /* Add form panel */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 24px;
      box-shadow: var(--shadow);
      display: none;
    }

    .panel.open {
      display: block;
      animation: slideDown 0.25s ease;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .panel h2 {
      font-size: 1.15rem;
      margin-bottom: 16px;
      color: var(--text);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 500;
    }

    .form-group input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }

    .form-group input:focus {
      border-color: var(--accent);
    }

    .form-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* Results */
    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .results-header h2 {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .results-count {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow-x: auto;
      box-shadow: var(--shadow);
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.92rem;
    }

    thead {
      background: var(--surface2);
      position: sticky;
      top: 0;
      z-index: 1;
    }

    th {
      text-align: left;
      padding: 14px 16px;
      font-weight: 600;
      color: var(--text-muted);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    tbody tr {
      transition: background 0.15s;
    }

    tbody tr:hover {
      background: rgba(59, 130, 246, 0.08);
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    .plu-cell {
      font-family: ui-monospace, 'Cascadia Code', monospace;
      font-weight: 600;
      color: #60a5fa;
      white-space: nowrap;
      min-width: 90px;
    }

    .article-cell {
      font-family: ui-monospace, 'Cascadia Code', monospace;
      color: var(--text-muted);
      white-space: nowrap;
      min-width: 100px;
    }

    .desc-cell {
      font-weight: 500;
      max-width: 420px;
      min-width: 160px;
      word-break: break-word;
    }

    .mrp-cell {
      font-weight: 700;
      color: #34d399;
      white-space: nowrap;
      text-align: right;
      min-width: 90px;
    }

    .badge-new {
      display: inline-block;
      background: rgba(34, 197, 94, 0.2);
      color: #4ade80;
      font-size: 0.7rem;
      padding: 2px 7px;
      border-radius: 4px;
      margin-left: 6px;
      font-weight: 600;
      vertical-align: middle;
    }

    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: var(--text-muted);
    }

    .empty-state svg {
      width: 48px;
      height: 48px;
      margin-bottom: 12px;
      opacity: 0.5;
    }

    /* Highlight match */
    mark {
      background: rgba(251, 191, 36, 0.35);
      color: inherit;
      border-radius: 2px;
      padding: 0 2px;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 14px 20px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      z-index: 100;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s ease;
      max-width: 320px;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .toast.success {
      border-left: 4px solid var(--success);
    }

    .toast.error {
      border-left: 4px solid var(--danger);
    }

    /* Responsive */
    @media (max-width: 700px) {
      .desc-cell {
        max-width: 200px;
      }

      header h1 {
        font-size: 1.4rem;
      }

      th, td {
        padding: 10px 12px;
        font-size: 0.85rem;
      }
    }

    @media (max-width: 480px) {
      th, td {
        padding: 8px 10px;
        font-size: 0.8rem;
      }

      .plu-cell, .article-cell {
        font-size: 0.78rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>PLU Search & Inventory</h1>
      <div class="stats">
        <div class="stat-pill">Total: <strong id="totalCount">0</strong></div>
        <div class="stat-pill">Showing: <strong id="showCount">0</strong></div>
        <div class="stat-pill" id="modifiedPill">Modified: <strong>No</strong></div>
      </div>
    </header>

    <section class="search-section">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="search" id="searchInput" placeholder="Search PLU, Article, Description or MRP..." autocomplete="off" autofocus>
        <button class="btn btn-primary" id="searchBtn">Search</button>
        <button class="btn btn-secondary" id="clearBtn">Clear</button>
        <button class="btn btn-success" id="toggleAddBtn">+ Add Item</button>
        <button class="btn btn-primary" id="exportBtn">⬇ Export CSV</button>
        <button class="btn btn-secondary" id="resetBtn" title="Reset to original Excel data">↺ Reset</button>
      </div>
    </section>

    <div class="panel" id="addPanel">
      <h2>Add New Item <span style="font-size:0.75rem;font-weight:400;color:var(--text-muted)">(saved permanently in this browser)</span></h2>
      <div class="form-grid">
        <div class="form-group">
          <label for="newPlu">PLU Code *</label>
          <input type="number" id="newPlu" placeholder="e.g. 9999" required>
        </div>
        <div class="form-group">
          <label for="newArticle">Article *</label>
          <input type="number" id="newArticle" placeholder="e.g. 1500000" required>
        </div>
        <div class="form-group">
          <label for="newDesc">Description *</label>
          <input type="text" id="newDesc" placeholder="e.g. FRESH APPLE KG" required>
        </div>
        <div class="form-group">
          <label for="newMrp">MRP *</label>
          <input type="number" id="newMrp" placeholder="e.g. 199" min="0" required>
        </div>
      </div>
      <div class="form-actions">
        <button class="btn btn-success" id="saveItemBtn">Save Item</button>
        <button class="btn btn-secondary" id="cancelAddBtn">Cancel</button>
      </div>
    </div>

    <div class="results-header">
      <h2>Results</h2>
      <span class="results-count" id="resultsInfo">Type to search or leave empty to show all</span>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>PLU Code</th>
            <th>Article</th>
            <th>Description</th>
            <th style="text-align:right">MRP</th>
            <th style="width:70px"></th>
          </tr>
        </thead>
        <tbody id="resultsBody">
          <!-- filled by JS -->
        </tbody>
      </table>
      <div class="empty-state" id="emptyState" style="display:none">
        <div style="font-size:2rem;margin-bottom:8px">📦</div>
        <p>No matching items found</p>
        <p style="font-size:0.85rem;margin-top:4px">Try a different search term</p>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

"mrp":399},{"plu":13336,"article":1477601,"description":"BLUEBERRIES 1KG LARGE TUB","mrp":2299}];

    // ========== PERMANENT DATA (localStorage master list) ==========
    let allData = [];
    const MASTER_KEY = 'plu_master_v2';
    const ORIGINAL_COUNT = (typeof EMBEDDED_DATA !== 'undefined' && EMBEDDED_DATA) ? EMBEDDED_DATA.length : 0;

    function loadMaster() {
      try {
        const raw = localStorage.getItem(MASTER_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed) && parsed.length > 0) {
            allData = parsed.map(item => ({
              plu: item.plu,
              article: item.article,
              description: item.description || '',
              mrp: item.mrp != null ? item.mrp : 0
            }));
            return true;
          }
        }
      } catch (e) {
        console.warn('Failed to load master data', e);
      }
      return false;
    }

    function saveMaster() {
      try {
        localStorage.setItem(MASTER_KEY, JSON.stringify(allData));
      } catch (e) {
        showToast('Storage full or blocked. Export your data!', 'error');
        console.error(e);
      }
    }

    function seedFromEmbedded() {
      if (typeof EMBEDDED_DATA === 'undefined' || !EMBEDDED_DATA.length) {
        allData = [];
        return;
      }
      allData = EMBEDDED_DATA.map(item => ({
        plu: item.plu,
        article: item.article,
        description: item.description || '',
        mrp: item.mrp != null ? item.mrp : 0
      }));
      saveMaster();
    }

    function updateStats() {
      document.getElementById('totalCount').textContent = allData.length.toLocaleString();
      const isModified = allData.length !== ORIGINAL_COUNT;
      const modPill = document.getElementById('modifiedPill');
      if (modPill) {
        modPill.innerHTML = isModified
          ? 'Modified: <strong>Yes</strong>'
          : 'Modified: <strong>No</strong>';
      }
    }

    // ========== SEARCH ==========
    function normalize(str) {
      return String(str ?? '').toLowerCase().trim();
    }

    function highlight(text, query) {
      if (!query) return escapeHtml(text);
      const q = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const re = new RegExp('(' + q + ')', 'gi');
      return escapeHtml(String(text)).replace(re, '<mark>$1</mark>');
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function search(query) {
      const q = normalize(query);
      if (!q) return allData;
      return allData.filter(item => {
        return normalize(item.plu).includes(q)
          || normalize(item.article).includes(q)
          || normalize(item.description).includes(q)
          || normalize(item.mrp).includes(q);
      });
    }

    function renderResults(items, query) {
      query = query || '';
      const tbody = document.getElementById('resultsBody');
      const empty = document.getElementById('emptyState');
      const info = document.getElementById('resultsInfo');
      const showCount = document.getElementById('showCount');

      showCount.textContent = items.length.toLocaleString();

      if (items.length === 0) {
        tbody.innerHTML = '';
        empty.style.display = 'block';
        info.textContent = query ? 'No results for "' + query + '"' : 'No items';
        return;
      }

      empty.style.display = 'none';
      info.textContent = query
        ? items.length + ' result' + (items.length !== 1 ? 's' : '') + ' for "' + query + '"'
        : 'Showing all ' + items.length + ' items';

      const maxShow = 500;
      const toShow = items.slice(0, maxShow);
      const truncated = items.length > maxShow;

      tbody.innerHTML = toShow.map(function(item) {
        return '<tr>'
          + '<td class="plu-cell">' + highlight(item.plu, query) + '</td>'
          + '<td class="article-cell">' + highlight(item.article, query) + '</td>'
          + '<td class="desc-cell">' + highlight(item.description, query) + '</td>'
          + '<td class="mrp-cell">₹ ' + Number(item.mrp).toLocaleString('en-IN') + '</td>'
          + '<td><button class="btn btn-danger" data-plu="' + item.plu + '" title="Delete permanently">✕</button></td>'
          + '</tr>';
      }).join('');

      if (truncated) {
        tbody.innerHTML += '<tr><td colspan="5" style="text-align:center;color:var(--text-muted);padding:16px">'
          + 'Showing first ' + maxShow + ' of ' + items.length + ' results. Refine your search.'
          + '</td></tr>';
      }

      tbody.querySelectorAll('.btn-danger').forEach(function(btn) {
        btn.addEventListener('click', function() {
          const plu = Number(btn.dataset.plu);
          deleteItem(plu);
        });
      });
    }

    function doSearch() {
      const query = document.getElementById('searchInput').value;
      const results = search(query);
      renderResults(results, query.trim());
    }

    // ========== ADD / DELETE (permanent in localStorage) ==========
    function addItem() {
      const plu = document.getElementById('newPlu').value.trim();
      const article = document.getElementById('newArticle').value.trim();
      const description = document.getElementById('newDesc').value.trim();
      const mrp = document.getElementById('newMrp').value.trim();

      if (!plu || !article || !description || !mrp) {
        showToast('Please fill all fields', 'error');
        return;
      }

      const pluNum = Number(plu);
      const articleNum = Number(article);
      const mrpNum = Number(mrp);

      if (isNaN(pluNum) || isNaN(articleNum) || isNaN(mrpNum)) {
        showToast('PLU, Article and MRP must be numbers', 'error');
        return;
      }

      if (allData.some(function(d) { return Number(d.plu) === pluNum; })) {
        showToast('PLU ' + pluNum + ' already exists', 'error');
        return;
      }

      allData.push({
        plu: pluNum,
        article: articleNum,
        description: description.toUpperCase(),
        mrp: mrpNum
      });
      saveMaster();
      updateStats();
      doSearch();

      document.getElementById('newPlu').value = '';
      document.getElementById('newArticle').value = '';
      document.getElementById('newDesc').value = '';
      document.getElementById('newMrp').value = '';

      showToast('Added permanently: ' + description.toUpperCase(), 'success');
    }

    function deleteItem(plu) {
      const idx = allData.findIndex(function(i) { return Number(i.plu) === Number(plu); });
      if (idx === -1) return;
      const name = allData[idx].description;
      if (!confirm('Delete permanently?\n\nPLU: ' + plu + '\n' + name)) return;
      allData.splice(idx, 1);
      saveMaster();
      updateStats();
      doSearch();
      showToast('Deleted permanently: ' + name, 'success');
    }

    // ========== EXPORT CSV (so you can save a real permanent file) ==========
    function exportCSV() {
      if (!allData.length) {
        showToast('Nothing to export', 'error');
        return;
      }
      const header = 'PLU CODE,ARTICLE,DESCRIPTION,MRP';
      const rows = allData.map(function(item) {
        const desc = String(item.description).replace(/"/g, '""');
        return item.plu + ',' + item.article + ',"' + desc + '",' + item.mrp;
      });
      const csv = header + '\n' + rows.join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'PLU_data_' + new Date().toISOString().slice(0, 10) + '.csv';
      a.click();
      URL.revokeObjectURL(url);
      showToast('CSV downloaded — open in Excel and save as .xlsx', 'success');
    }

    function resetToOriginal() {
      if (!confirm('Reset to original Excel data?\n\nAll adds and deletes in this browser will be lost.')) return;
      seedFromEmbedded();
      updateStats();
      doSearch();
      showToast('Reset to original data', 'success');
    }

    // ========== TOAST ==========
    let toastTimer;
    function showToast(msg, type) {
      type = type || 'success';
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'toast show ' + type;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function() { el.classList.remove('show'); }, 2800);
    }

    // ========== UI EVENTS ==========
    document.getElementById('searchInput').addEventListener('input', function() {
      clearTimeout(window._searchTimer);
      window._searchTimer = setTimeout(doSearch, 180);
    });
    document.getElementById('searchInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') doSearch();
    });
    document.getElementById('searchBtn').addEventListener('click', doSearch);
    document.getElementById('clearBtn').addEventListener('click', function() {
      document.getElementById('searchInput').value = '';
      doSearch();
      document.getElementById('searchInput').focus();
    });
    document.getElementById('toggleAddBtn').addEventListener('click', function() {
      const panel = document.getElementById('addPanel');
      panel.classList.toggle('open');
      if (panel.classList.contains('open')) document.getElementById('newPlu').focus();
    });
    document.getElementById('cancelAddBtn').addEventListener('click', function() {
      document.getElementById('addPanel').classList.remove('open');
    });
    document.getElementById('saveItemBtn').addEventListener('click', addItem);

    const exportBtn = document.getElementById('exportBtn');
    if (exportBtn) exportBtn.addEventListener('click', exportCSV);
    const resetBtn = document.getElementById('resetBtn');
    if (resetBtn) resetBtn.addEventListener('click', resetToOriginal);

    // ========== INIT ==========
    function init() {
      if (!loadMaster()) {
        seedFromEmbedded();
      }
      if (!allData.length) {
        showToast('No product data loaded', 'error');
      }
      updateStats();
      doSearch();
    }

    init();

  </script>
